  ["max_service_gap_us", "u16", "not measured by the core: avail bit clear"],
  ["max_step_gap_ms", "u16", "max_observed_step_gap_ms"],
  ["deadline_misses", "u16", ""],
  ["uart_overrun", "u16", ""],
  ["ring_overflow", "u16", "software rings and RX slots"],
  ["hw_overflow", "u16", "card ring/FIFO overflow"],
  ["tcp_retransmits", "u16", ""],
  ["drop_size", "u16", ""],
  ["drop_checksum", "u16", ""],
  ["drop_foreign", "u16", "foreign address/port/peer"],
  ["drop_fragment", "u16", ""],
  ["arp_requests", "u16", ""],
  ["tx_frames", "u16", ""],
  ["rx_frames", "u16", ""],
  ["tx_bytes", "u32", "payload bytes"],
  ["rx_bytes", "u32", "payload bytes"],
  ["stream_errors", "u16", ""],
]

[[block]]
name = "EVT"
title = "Event (8 bytes)"
fields = [
  ["type", "u8", "UNETG_EV_*"],
  ["channel", "u8", "0, or 0xFF for a global event"],
  ["tag", "u16", "0xFFFF without a tag"],
  ["status", "u8", "TX_DONE: UNETG_TXDONE_*"],
  ["slot", "u8", "0xFF without a slot"],
  ["detail", "u16", "0 without detail"],
]

[[block]]
name = "PEER"
title = "OPEN peer argument"
fields = [
  ["ip", "ip4", "network order"],
  ["port", "u16", "little-endian"],
]

